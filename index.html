<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="./css/bootstrap.css" />
    <title>HELLO WORLD</title>
  </head>
  <body>
    <h1 id="title">FORMULARIO PRO</h1>

    <form id="form" action="">
      <label for="name">Nombre:</label>
      <input type="text" id="name" placeholder="Juan" />
      <label for="lastname">Apellidos:</label>
      <input type="text" id="lastname" placeholder="Pérez" />
      <button type="submit">Enviar</button>
    </form>
    <br><br>
    <div
      id="carouselExampleControls"
      class="carousel slide"
      data-bs-ride="carousel"
    >
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="./img/perrrito1.jpg" class="d-block w-50 mx-auto" alt="..." />
        </div>
        <div class="carousel-item">
          <img src="./img/perrito2.webp" class="d-block w-50 mx-auto" alt="..." />
        </div>
        <div class="carousel-item">
          <img src="./img/perrito3.jpg" class="d-block w-50 mx-auto" alt="..." />
        </div>
      </div>
      <button
        class="carousel-control-prev ms-1"
        type="button"
        data-bs-target="#carouselExampleControls"
        data-bs-slide="prev"
      >
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button
        class="carousel-control-next me-1"
        type="button"
        data-bs-target="#carouselExampleControls"
        data-bs-slide="next"
      >
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>

    <br><br>

    <script src="./main.js"></script>
    <script src="./js/bootstrap.js"></script>
  </body>
</html>
